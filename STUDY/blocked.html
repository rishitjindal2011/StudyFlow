<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked — StudyFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #f2f2fa;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      padding: 40px 32px;
      border-radius: 20px;
      background: rgba(255, 71, 87, 0.06);
      border: 1px solid rgba(255, 71, 87, 0.2);
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #8888a0; line-height: 1.6; margin-bottom: 24px; }
    .domain {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      background: rgba(255, 71, 87, 0.12);
      color: #ff4757;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #63ff88, #4dd96a);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚫 Blocked</h1>
    <div class="domain" id="domainLabel">this site</div>
    <p>StudyFlow shield is active. Go back to your session — this site can wait.</p>
    <button type="button" id="backBtn">Back to StudyFlow</button>
  </div>
  <script src="blocked.js"></script>
</body>

</html>
